name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build, server and tests use only Node.js built-ins; no install step is needed.
      - run: npm run test:security
      - run: npm run test:foods
