 <circle cx="66" cy="63" r="5" fill="#59d7a2"/><text x="84" y="69" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#7ddfc0">BİR TUR DAHA.</text>
 <text x="58" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="#f0f9ff">SNAKE</text>
 <text x="57" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="#59d7a2">CLASSIC<tspan fill="#e9fff8">+</tspan></text>
 <text x="62" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#b8cedd">Kaydır. Yön değiştir. Rekorunu geç.</text>
