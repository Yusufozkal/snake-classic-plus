<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
<title id="title">Snake Classic+ — Bir tur daha.</title><desc id="description">Koyu mavi bir oyun tahtası üzerinde yeşil yılan. 6 harita, 3 zorluk ve 14 yem ile güç.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102639"/><stop offset="1" stop-color="#06121e"/></linearGradient>
 <linearGradient id="body" x2="1" y2="1"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#23aa83"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#1e8f7b" stop-opacity=".3"/><stop offset="1" stop-color="#0a1928" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#294759" stroke-opacity=".55" stroke-width="1"/></pattern>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="8" stdDeviation="12" flood-color="#020b12" flood-opacity=".65"/></filter>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
 <clipPath id="round"><rect width="1200" height="440" rx="28"/></clipPath>
</defs>
<g clip-path="url(#round)">
 <rect width="1200" height="440" fill="url(#bg)"/><ellipse cx="970" cy="180" rx="430" ry="360" fill="url(#aura)"/>
