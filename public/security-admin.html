<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Güvenlik bildirimleri | Snake Classic+</title><style>
:root{color-scheme:dark;font:16px/1.6 system-ui;background:#090d16;color:#f8fafc}*{box-sizing:border-box}main{max-width:900px;margin:24px auto;padding:24px}a{color:#7dd3fc}article{padding:20px;border:1px solid #334155;background:#142032;border-radius:12px;margin:16px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}h2{font-size:1rem}button{font:inherit;background:#0369a1;color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer}:focus-visible{outline:3px solid #facc15;outline-offset:3px}
</style></head><body><main><a href="/admin">← Oyun kayıtlarına dön</a><h1>Güvenlik bildirimleri</h1><p>Son 50 bildirim. Yalnızca site sahibi görebilir. Bildirimlerdeki bağlantı ve önerileri değerlendirmeden uygulama.</p><button id="refresh">Yenile</button><p id="status" role="status" aria-live="polite"></p><div id="reports"></div></main><script>
async function load(){const status=document.getElementById('status'),button=document.getElementById('refresh');button.disabled=true;status.textContent='Yükleniyor…';try{const response=await fetch('/api/admin/security-reports',{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Yüklenemedi.');const list=document.getElementById('reports');list.replaceChildren();for(const report of data.reports){const card=document.createElement('article'),title=document.createElement('h2'),contact=document.createElement('p'),details=document.createElement('p');title.textContent=new Date(report.created_at).toLocaleString('tr-TR');contact.textContent='İletişim: '+(report.contact||'Belirtilmemiş');details.textContent=report.details;card.append(title,contact,details);list.append(card);}status.textContent=data.reports.length?data.reports.length+' bildirim gösteriliyor.':'Henüz bildirim yok.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
